name: Monitor websites

on:
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Sites parallel (1-3)'
        default: '1'
        required: false

concurrency:
  group: monitoring
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: history.json
          key: monitoring-history-${{ github.run_id }}
          restore-keys: monitoring-history-

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Run monitor
        run: npm run monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONCURRENCY: ${{ inputs.concurrency || '1' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages

    steps:
      - uses: actions/deploy-pages@v4
